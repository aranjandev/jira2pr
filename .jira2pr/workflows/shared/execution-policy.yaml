# Execution policy — cross-cutting rules the runtime applies to every workflow.
#
# These rules are platform-neutral: both the Copilot supervisor and the Aider
# workflow executor must honor them identically.

execution_policy:

  retry:
    # Used when a state has no explicit `retry.max_attempts`.
    default_max_attempts: 1
    # What happens once a state has exhausted its max_attempts and the
    # supervisor still returns "failure": treat it as an escalation instead
    # of looping forever or silently succeeding.
    on_exhaustion: escalate
    # Global safety net across the WHOLE run, independent of any single
    # state's own max_attempts. Bounds total loop iterations regardless of
    # which states are oscillating (e.g. review<->implement, or a future
    # plan<->implement loop) without needing per-pair configuration.
    # Exceeding it escalates via terminal_outcomes.escalated below, same as
    # any other escalation. A workflow may override this in its own file.
    max_total_iterations: 40

  criteria_evaluation:
    # "all_pass": every label listed for the state's success_criteria key
    # must be satisfied (no violations) for the outcome to be "success".
    # A single unresolved label is enough to fail the state.
    mode: all_pass

  terminal_outcomes:
    # Every state with `terminal: true` must declare which of these two
    # outcomes it represents, so runtimes and PR templates can render the
    # correct final status without guessing from the state name.
    success: done
    escalated: human-review
