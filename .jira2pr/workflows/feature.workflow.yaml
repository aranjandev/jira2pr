version: 1

workflow: feature

initial_state: jira-ingest

# Global safety net across ALL states (not per-state retries): bounds total
# loop iterations for the whole run regardless of which states are
# oscillating, overriding the shared default in
# workflows/shared/execution-policy.yaml. Exceeding it escalates to the same
# terminal as any other escalation (see terminal_outcomes.escalated there).
# The cap is base + per_task * N, where N is the number of tasks in plan.yaml
# (implementation and test). Before plan.yaml exists, only base applies.
retry:
  max_total_iterations:
    base: 10
    per_task: 2

# Shared budgets. Each failed run-tests verification and each review
# changes_requested sends implement back into its cycle, and both draw from
# this budget. The budget is cumulative for the whole run.
budgets:
  implement-cycle: 5

states:
  jira-ingest:
    worker: jira-reader
    produces:
      - requirements.md
    updates:
      - workflow-state.md
    validation:
      success_criteria: jira-ingest
    retry:
      max_attempts: 2
    transitions:
      success: plan
      failure: jira-ingest
      escalate: human-review

  plan:
    worker: planner
    produces:
      - plan.yaml
    consumes:
      - requirements.md
      - decisions/*.md
    updates:
      - workflow-state.md
    validation:
      success_criteria: planning
    retry:
      max_attempts: 3
    transitions:
      success: implement
      failure: plan
      escalate: human-review

  implement:
    worker: coder
    consumes:
      - plan.yaml
      - decisions/*.md
      - review.md
    produces: []
    updates:
      - workflow-state.md
    validation:
      supervisor: false
    retry:
      max_attempts: 4
    transitions:
      success: run-tests
      failure: implement
      escalate: human-review

  # Deterministic verification (no LLM). Runs the configured test and lint
  # commands. On failure the output is handed to implement as feedback, and
  # the coder fixes it. The max_attempts budget bounds implement <-> run-tests.
  run-tests:
    kind: verification
    retry:
      budget: implement-cycle
    transitions:
      success: review
      failure: implement
      escalate: human-review

  review:
    worker: reviewer
    consumes:
      - requirements.md
      - plan.yaml
    produces:
      - review.md
    retry:
      # max_attempts bounds malformed review.md (invalid_output, self-loop).
      # changes_requested draws from the shared implement-cycle budget.
      max_attempts: 3
      budget: implement-cycle
    transitions:
      success: submit
      failure: implement
      invalid_output: review
      escalate: human-review

  submit:
    worker: pr-author
    consumes:
      - requirements.md
      - plan.yaml
      - review.md
    produces:
      - pr-description.md

    transitions:
      success: done
      failure: submit
      escalate: human-review

  done:
    terminal: true
    outcome: success

  human-review:
    terminal: true
    outcome: escalated