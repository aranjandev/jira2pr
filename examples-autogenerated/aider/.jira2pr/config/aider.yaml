# Aider backend configuration.
# `models` maps model-tier -> aider/LiteLLM model id (edit freely to
# match whichever provider/API key you have configured).
backend: aider
models:
  '0': gpt-5-mini
  '1': claude-haiku-4-5
  '2': claude-sonnet-4-5
  '3': claude-opus-4-1
cli:
  base_args:
  - --yes-always
  - --no-auto-commits
