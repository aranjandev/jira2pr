# Agent Registry
#
# Platform-independent metadata describing all Jira2PR agents.
#
# Canonical agent behavior is defined in:
#
#   canonical/agents/<slug>.md
#
# Agent invocation, transitions, retries, and orchestration
# are defined by workflow definitions under:
#
#   canonical/workflows/
#
# The registry is primarily used by platform adapters for:
#
# - model selection
# - agent generation
# - documentation
# - runtime metadata

agents:

  - slug: orchestrator
    name: orchestrator
    kind: orchestrator
    description: >
      Drives a workflow from its initial state to a terminal state: invokes
      the worker for each state, invokes supervisor to evaluate the worker's
      output, applies transition/retry/escalation logic, and persists
      workflow state.

  - slug: supervisor
    name: supervisor
    kind: supervisor
    description: >
      Evaluates worker outputs against workflow success criteria and returns
      structured outcomes. Workflow definitions determine how those outcomes
      are translated into state transitions.

  - slug: jira-reader
    name: jira-reader
    kind: worker
    artifact_schema: requirements-schema.md
    description: >
      Converts JIRA issue information into a structured requirements document.
      Preserves ticket fidelity and identifies missing or ambiguous
      requirements.

  - slug: researcher
    name: researcher
    kind: worker
    artifact_schema: decision-schema.md
    description: >
      Investigates technical questions, evaluates alternatives, and produces
      evidence-based recommendations. May create decision artifacts when a
      recommendation materially affects planning or implementation.

  - slug: planner
    name: planner
    kind: worker
    artifact_schema: plan-schema.md
    description: >
      Produces deterministic implementation plans from requirements,
      repository context, and project constraints.

  - slug: coder
    name: coder
    kind: worker
    description: >
      Implements approved plans with minimal scope, updates required tests,
      and follows existing repository conventions.

  - slug: reviewer
    name: reviewer
    kind: worker
    artifact_schema: review-schema.md
    description: >
      Evaluates completed implementations for correctness, requirements
      coverage, risks, and test quality, producing a structured review.

  - slug: pr-author
    name: pr-author
    kind: worker
    artifact_schema: pr-schema.md
    description: >
      Prepares pull request content, summarizes completed work, follows
      commit conventions, and finalizes changes for human review.