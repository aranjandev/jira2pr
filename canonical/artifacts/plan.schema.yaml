# plan-schema.yaml

version: 1

summary: >
  Extend deck-board-analysis to process multiple CSV files and produce
  one combined parquet output.

tasks:

  - id: T1
    file_path: tools/deck_board_analysis/main.py
    edit_mode: modify
    instructions: >
      Normalize cfg.input.dataset_csv so both a single string and a list
      of paths are accepted. Iterate over the normalized paths, load each
      CSV, and combine the resulting rows before downstream processing.
    dependencies: []

  - id: T2
    file_path: tools/deck_board_analysis/processor.py
    edit_mode: modify
    instructions: >
      Update processing as required to operate on the combined dataset
      while preserving existing single-CSV behavior.
    dependencies:
      - T1

  - id: T3
    file_path: tests/tools/test_deck_board_analysis.py
    edit_mode: modify
    instructions: >
      Add coverage for multiple CSV inputs, single CSV backward
      compatibility, and invalid input handling.
    dependencies:
      - T1
      - T2

tests:
  - description: Single CSV configuration remains supported.
  - description: Multiple CSV files are combined correctly.
  - description: Invalid or missing CSV input fails according to existing error-handling conventions.

constraints:
  - Preserve backward compatibility.
  - Do not introduce new dependencies.
  - Do not perform unrelated refactoring.

out_of_scope:
  - Changes to unrelated analysis tools.