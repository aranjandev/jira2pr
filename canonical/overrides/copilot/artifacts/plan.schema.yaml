# Jira2PR Plan Schema (Copilot)
#
# The planner must produce plan.yaml using this structure.
#
# Unlike the runtime schema, a task is a coherent unit of work that may span
# several files. Nothing validates this file deterministically; the
# supervisor and the downstream agents read it as written.
#
# Rules:
# - Output must be valid YAML.
# - Include only work required to satisfy the requirements.
# - A task covers one coherent change. Group closely related edits; do not
#   bundle unrelated changes.
# - Keep the plan small: at most 5 files in total unless the requirements
#   demand more.
# - Tasks must be ordered by dependency.
# - Task IDs must be unique.
# - files lists the repository files the task is expected to touch, with paths
#   relative to the repository root.
# - edit_mode must be one of: create, modify, delete.
# - dependencies contains task IDs that must complete before this task.
# - Use [] when a list has no entries.
# - Do not add fields that are not defined by this schema.

version: 1

# Concise description of the implementation approach.
summary: ""

# Ordered implementation units.
tasks:

  - id: T1

    # Short name for the unit of work.
    title: ""

    # Concrete instructions for the coder.
    # Describe WHAT must change and relevant constraints, using explicit
    # actions ("add a check for X", "return an error when Y").
    # Do not include unrelated refactoring or optional improvements.
    instructions: ""

    # Files this task is expected to touch.
    files:
      - path: ""
        # One of: create | modify | delete
        edit_mode: modify

    # IDs of tasks that must complete before this task.
    # Use [] when there are no dependencies.
    dependencies: []

  - id: T2

    title: ""

    instructions: ""

    files:
      - path: ""
        edit_mode: create

    dependencies: []


# Tests that must be created or modified as part of the implementation.
# Each entry must include at least one success case and one edge or failure
# case.
tests:

  - id: TEST1

    title: ""

    # Concrete instructions describing the tests the coder must add.
    instructions: ""

    # Test files this entry is expected to touch.
    files:
      - path: ""
        # One of: create | modify
        edit_mode: modify

    # Behaviors or requirements this test verifies.
    verifies:
      - ""

    # Implementation task IDs that must be completed before adding this test.
    dependencies: []


# Implementation constraints that apply across tasks.
constraints: []

# Explicitly excluded work.
# Use [] when there is nothing to declare.
out_of_scope: []
