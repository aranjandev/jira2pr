# jira2pr Workflow State
#
# This file is owned by the workflow runtime.
# Workers may read this file but MUST NOT modify it.
#
# Purpose:
# - Resume interrupted workflows
# - Record workflow progress
# - Track generated artifacts
# - Track retry counts
# - Provide audit history

# Workflow type being executed.
# Examples:
#   feature
#   bugfix
#   scope-creep
workflow: ""

# External work item identifier.
# Examples:
#   PROJ-123
#   BUG-456
work_item: ""

# Current workflow status.
#
# Valid values:
#   active
#   completed
#   escalated
#   failed
status: active

# Current state from the workflow definition.
#
# Examples:
#   jira-ingest
#   plan
#   implement
#   review
#   submit
#   human-review
current_state: ""

# Retry counts per state.
#
# Example:
# retry_counts:
#   plan: 1
#   implement: 0
retry_counts: {}

# Total non-terminal state visits across the whole run so far.
#
# Global safety net independent of any single state's retry_counts: bounds
# oscillation between ANY states, not just self-looping ones. See
# execution_policy.retry.max_total_iterations / this workflow's own
# retry.max_total_iterations override.
total_iterations: 0

# Artifacts created during execution.
#
# Examples:
#   requirements.md
#   plan.md
#   review.md
#   pr-description.md
artifacts: []

# Durable decision artifacts produced by research or
# architectural evaluations.
#
# Examples:
#   decision-001.md
#   decision-002.md
decisions: []

# Escalation events requiring human intervention.
#
# Example:
# escalations:
#   - timestamp: "2026-09-11T15:42:30Z"
#     state: plan
#     reason: "architecture_decision_required"
escalations: []

# State transition history.
#
# A new entry is appended whenever a state completes.
#
# Example:
# history:
#   - timestamp: "2026-09-11T15:30:00Z"
#     state: jira-ingest
#     attempt: 1
#     outcome: success
#     notes: "Requirements extracted"
history: []

# Optional runtime metadata.
#
# Examples:
# metadata:
#   workflow_version: 1
#   runtime: aider
#   model: qwen2.5-coder:30b
metadata: {}