version: 1

workflow: feature

initial_state: jira-ingest

# Global safety net across ALL states (not per-state retries): bounds total
# loop iterations for the whole run regardless of which states are
# oscillating, overriding the shared default in
# workflows/shared/execution-policy.yaml. Exceeding it escalates to the same
# terminal as any other escalation (see terminal_outcomes.escalated there).
retry:
  max_total_iterations: 20

states:
  jira-ingest:
    worker: jira-reader
    produces:
      - requirements.md
    updates:
      - workflow-state.md
    validation:
      success_criteria: jira-ingest
    retry:
      max_attempts: 2
    transitions:
      success: plan
      failure: jira-ingest
      escalate: human-review

  plan:
    worker: planner
    produces:
      - plan.md
    consumes:
      - requirements.md
      - decisions/*.md
    updates:
      - workflow-state.md
    validation:
      success_criteria: planning
    retry:
      max_attempts: 2
    transitions:
      success: implement
      failure: plan
      escalate: human-review

  implement:
    worker: coder
    consumes:
      - plan.md
      - requirements.md
      - decisions/*.md
    produces: []
    updates:
      - workflow-state.md
    validation:
      success_criteria: implementation
    retry:
      max_attempts: 2
    transitions:
      success: review
      failure: implement
      escalate: human-review

  review:
    worker: reviewer
    consumes:
      - plan.md
      - requirements.md
      - decisions/*.md
    produces:
      - review.md
    updates:
      - workflow-state.md
    validation:
      success_criteria: review
    # bounds total review<->implement rework cycles, not a self-retry
    retry:
      max_attempts: 3
    transitions:
      success: submit
      failure: implement
      escalate: human-review

  submit:
    worker: pr-author
    consumes:
      - requirements.md
      - plan.md
      - review.md
      - decisions/*.md
    updates:
      - workflow-state.md
    validation:
      success_criteria: submit
    retry:
      max_attempts: 2
    transitions:
      success: done
      failure: submit
      escalate: human-review

  done:
    terminal: true
    outcome: success

  human-review:
    terminal: true
    outcome: escalated

